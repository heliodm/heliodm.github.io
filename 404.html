<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Hélio Mendonça</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #141430;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .codigo {
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(90deg, #6d5dfc, #ff8a5c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    a {
      color: #fff;
    }
  </style>
</head>
<body>
  <div>
    <div class="codigo">404</div>
    <h1 class="h3 mt-3">Ops, página não encontrada!</h1>
    <p class="text-muted">O endereço que você acessou não existe ou foi movido.</p>
    <a href="/" class="btn btn-primary mt-2">
      <i class="bi bi-house me-2"></i>Voltar para o início
    </a>
  </div>
</body>
</html>
